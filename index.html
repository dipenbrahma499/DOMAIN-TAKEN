<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#070b18">
<meta name="description" content="This domain is registered and maintained by Dipen.">

<title>Domain Taken — by Dipen</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Background -->
<canvas id="bg" aria-hidden="true"></canvas>

<div class="orb a" aria-hidden="true"></div>
<div class="orb b" aria-hidden="true"></div>
<div class="orb c" aria-hidden="true"></div>


<!-- Main Card -->
<main class="card">

    <!-- Lock Badge -->
    <div class="lock" aria-hidden="true">

        <span class="ring"></span>
        <span class="ring r2"></span>

        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
            <rect
                x="4"
                y="10.5"
                width="16"
                height="10.5"
                rx="2.5"
            ></rect>

            <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path>

            <circle
                cx="12"
                cy="15.7"
                r="1.15"
                fill="currentColor"
                stroke="none"
            ></circle>
        </svg>

    </div>


    <!-- Status -->
    <span class="eyebrow">
        Status · Registered
    </span>


    <!-- Heading -->
    <h1>
        This Domain Is Taken
    </h1>


    <!-- Domain Name -->
    <div class="domain">

        <span
            class="dot"
            aria-hidden="true"
        ></span>

        <span id="domainName"></span>

    </div>


    <!-- Typing Text -->
    <p
        class="typing"
        id="typing"
        aria-live="polite"
    ></p>


    <!-- Action Buttons -->
    <div class="actions">


        <!-- Contact Owner -->
        <a
            class="btn primary"
            id="mailBtn"
            href="https://dipenbrahma.vercel.app/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Contact Owner"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <path d="M3 6.5h18v11H3z"></path>
                <path d="M3 7l9 6 9-6"></path>
            </svg>

            <span>
                Contact Owner
            </span>

        </a>


        <!-- Copy Email -->
        <a
            class="btn ghost"
            id="copyBtn"
            href="https://dipenbrahma.vercel.app/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Copy Email"
        >

            <span>
                Copy Email
            </span>

        </a>


    </div>


    <!-- Footer -->
    <div class="foot">

        <span class="foot-line">
            Registered &amp; maintained by
            <strong>Dipen</strong>
        </span>

        <span
            class="foot-sep"
            aria-hidden="true"
        >
            •
        </span>

        <span class="foot-line">
            ©
            <span id="year">2026</span>
        </span>

    </div>

</main>


<!-- JavaScript -->
<script src="script.js"></script>


</body>
</html>
