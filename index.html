<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<title>Domain Taken — by Dipen</title>
<meta name="description" content="This domain is registered and maintained by Dipen.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="orb a" aria-hidden="true"></div>
<div class="orb b" aria-hidden="true"></div>
<div class="orb c" aria-hidden="true"></div>

<main class="card">

  <!-- Lock badge -->
  <div class="lock" aria-hidden="true">
    <span class="ring"></span>
    <span class="ring r2"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/>
      <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
      <circle cx="12" cy="15.7" r="1.15" fill="currentColor" stroke="none"/>
    </svg>
  </div>

  <span class="eyebrow">Status · Registered</span>

  <h1>This Domain Is Taken</h1>

  <div class="domain">
    <span class="dot" aria-hidden="true"></span>
    <span id="domainName">domain.com</span>
  </div>

  <p class="typing" id="typing" aria-live="polite"></p>

  <div class="actions">
    <a class="btn primary" id="mailBtn" href="https://dipenbrahma.vercel.app">
      <svg viewBox="0 0 24 24">
        <path d="M3 6.5h18v11H3z"/>
        <path d="m3 7 9 6 9-6"/>
    </svg>

    <span>Contact Owner</span>
</a>
   

    <button class="btn ghost" id="copyBtn" type="button">
      <!--svg viewBox="0 0 24 24">
        <rect x="9" y="9" width="11" height="11" rx="2"/>
        <path d="M5 15V5a2 2 0 0 1 2-2h8"/>
    </svg-->
      <span>Copy Email</span>
    </button>
  </div>

  <div class="foot">
    <span class="foot-line">
      Registered &amp; maintained by <strong>Dipen</strong>
    </span>
    <span class="foot-sep" aria-hidden="true">•</span>
    <span class="foot-line">© <span id="year">2025</span></span>
  </div>

</main>


<script src="script.js"></script>
</body>
</html>
